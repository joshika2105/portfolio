<button
  type="button"
  class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-border bg-card text-text shadow-[0_2px_10px_var(--shadow-color)] transition-colors duration-150 hover:opacity-75 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-border"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.aria-pressed]="themeService.theme() === 'dark'"
  (click)="themeService.toggleTheme()"
>
  @if (themeService.theme() === 'dark') {
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
      />
    </svg>
  } @else {
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
    </svg>
  }
</button>
