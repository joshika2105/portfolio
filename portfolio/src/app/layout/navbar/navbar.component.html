<nav
  class="navbar-shell fixed inset-x-0 top-0 z-50 px-4 pt-3 sm:px-6"
  [class.navbar-shell--visible]="visible()"
  [attr.aria-hidden]="!visible()"
>
  <div
    class="mx-auto flex max-w-6xl items-center justify-between gap-4 rounded-xl border border-border bg-card/75 px-4 py-2 shadow-[0_8px_30px_var(--shadow-color)] backdrop-blur-xl"
  >
    <a routerLink="/" class="text-base font-semibold" style="font-family: var(--font-heading);">
      Portfolio
    </a>

    <ul class="hidden items-center gap-6 md:flex">
      @for (link of links(); track link.fragment) {
        <li>
          <a
            routerLink="/"
            [fragment]="link.fragment"
            class="text-sm font-medium text-text-secondary transition-colors duration-150 hover:text-highlight"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <div class="hidden items-center gap-2 md:flex">
      <div class="flex items-center gap-1 rounded-lg border border-border p-0.5">
        @for (language of languages; track language) {
          <button
            type="button"
            class="rounded-md px-2 py-1 text-xs font-semibold transition-colors duration-150"
            [class.bg-highlight]="languageService.language() === language"
            [class.text-on-highlight]="languageService.language() === language"
            [class.text-text-secondary]="languageService.language() !== language"
            [attr.aria-pressed]="languageService.language() === language"
            (click)="setLanguage(language)"
          >
            {{ language.toUpperCase() }}
          </button>
        }
      </div>
      <app-theme-toggle />
    </div>

    <div class="flex items-center gap-2 md:hidden">
      <app-theme-toggle />
      <button
        type="button"
        class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-border text-text transition-colors duration-150 hover:opacity-75"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu"
        aria-controls="mobile-nav-panel"
        (click)="toggleMobileMenu()"
      >
        @if (mobileMenuOpen()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div
    id="mobile-nav-panel"
    class="mobile-panel mx-auto mt-3 max-w-6xl overflow-hidden rounded-2xl border border-border bg-card/95 shadow-[0_8px_30px_var(--shadow-color)] backdrop-blur-xl md:hidden"
    [class.mobile-panel--open]="mobileMenuOpen()"
  >
    <ul class="flex flex-col gap-1 p-3">
      @for (link of links(); track link.fragment) {
        <li>
          <a
            routerLink="/"
            [fragment]="link.fragment"
            (click)="closeMobileMenu()"
            class="block rounded-lg px-3 py-2 text-sm font-medium text-text-secondary transition-colors duration-150 hover:bg-bg-secondary hover:text-highlight"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
    <div class="flex items-center gap-1 border-t border-border p-3">
      @for (language of languages; track language) {
        <button
          type="button"
          class="rounded-md px-3 py-1.5 text-xs font-semibold transition-colors duration-150"
          [class.bg-highlight]="languageService.language() === language"
          [class.text-on-highlight]="languageService.language() === language"
          [class.text-text-secondary]="languageService.language() !== language"
          [attr.aria-pressed]="languageService.language() === language"
          (click)="setLanguage(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</nav>
