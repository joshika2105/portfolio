<section id="projects" class="px-6 py-24 sm:px-10 lg:px-16">
  <div class="mx-auto max-w-6xl">
    <p appScrollReveal class="text-xs font-semibold uppercase tracking-[0.15em] text-highlight">
      {{ t().eyebrow }}
    </p>
    <h2 appScrollReveal [revealDelay]="80" class="mt-3">{{ t().title }}</h2>

    <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (project of projects(); track project.name; let i = $index) {
        <div appScrollReveal [revealDelay]="140 + i * 60">
          <app-project-card [project]="project" />
        </div>
      }
    </div>

    <!--
    <div class="mt-10 flex justify-center">

          <path d="M5 12h14M13 5l7 7-7 7" />
        </svg>
      </a>
    </div>
    -->
  </div>
</section>
