<section id="skills" class="px-6 py-24 sm:px-10 lg:px-16">
  <div class="mx-auto max-w-3xl text-center">
    <p appScrollReveal class="text-xs font-semibold uppercase tracking-[0.15em] text-highlight">
      {{ t().eyebrow }}
    </p>
    <h2 appScrollReveal [revealDelay]="80" class="mt-3">{{ t().title }}</h2>

    <div appScrollReveal [revealDelay]="160" class="mt-10 flex flex-wrap items-center justify-center gap-3">
      @for (skill of skills; track skill.name) {
        <span
          class="surface inline-flex items-center gap-2 rounded-full py-2 pl-3 pr-4 transition-transform duration-200 hover:-translate-y-0.5"
        >
          <svg
            class="h-4 w-4 shrink-0 text-highlight"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @switch (skill.icon) {
              @case ('java') {
                <path d="M6 9h10v5a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V9Z" />
                <path d="M16 10h1.5a2 2 0 0 1 0 4H16" />
                <path d="M9 4c-1.2 1 -1.2 2 0 3M13 4c-1.2 1 -1.2 2 0 3" />
              }
              @case ('javafx') {
                <rect x="4" y="5" width="16" height="14" rx="2" />
                <path d="M4 9h16" />
                <circle cx="7" cy="7" r="0.5" fill="currentColor" />
                <circle cx="9.5" cy="7" r="0.5" fill="currentColor" />
              }
              @case ('csharp') {
                <path d="M9 4 7 20M17 4l-2 16M4 9.5h16M4 15.5h16" />
              }
              @case ('javascript') {
                <path
                  d="M9 4c-2 0-3 1-3 3v2.5c0 1.2-1 2-2 2.5 1 .5 2 1.3 2 2.5V17c0 2 1 3 3 3"
                />
                <path
                  d="M15 4c2 0 3 1 3 3v2.5c0 1.2 1 2 2 2.5-1 .5-2 1.3-2 2.5V17c0 2-1 3-3 3"
                />
              }
              @case ('typescript') {
                <path d="M5 6h14M12 6v14" />
              }
              @case ('html') {
                <path d="M9 6 4 12l5 6M15 6l5 6-5 6" />
              }
              @case ('css') {
                <path d="M5 4h14l-1.4 15L12 21l-5.6-2L5 4Z" />
                <path d="M8 8h8l-.3 3H9.6M8.3 12l.4 4.5L12 17.5l3.3-1 .3-3.5" />
              }
              @case ('tailwind') {
                <path
                  d="M4 12c1-3 3-4.5 6-4.5 3.5 0 4 2.5 6.5 2.5 2 0 3.5-1 4.5-2.5-1 3-3 4.5-6 4.5-3.5 0-4-2.5-6.5-2.5-2 0-3.5 1-4.5 2.5Z"
                />
                <path
                  d="M2 17c1-3 3-4.5 6-4.5 3.5 0 4 2.5 6.5 2.5 2 0 3.5-1 4.5-2.5-1 3-3 4.5-6 4.5-3.5 0-4-2.5-6.5-2.5-2 0-3.5 1-4.5 2.5Z"
                />
              }
              @case ('angular') {
                <path d="M12 3.5 20 7l-1.3 11L12 21l-6.7-3L4 7l8-3.5Z" />
                <path d="M12 7.5 16.2 16.5M12 7.5 7.8 16.5M9.3 13.5h5.4" />
              }
              @case ('vue') {
                <path d="M3 5h4l5 9 5-9h4L12 20 3 5Z" />
                <path d="M7 5h3.2L12 8l1.8-3H17l-5 8.7L7 5Z" />
              }
              @case ('node') {
                <path
                  d="M12 3 20 7.5v9L12 21l-8-4.5v-9L12 3Z"
                />
                <path d="M9 14c.5 1 1.5 1.5 3 1.5s2.5-1 1.5-2-3-.5-4-1.5c-1-1 0-2 1.5-2s2.5.5 3 1.5" />
              }
              @case ('swift') {
                <path
                  d="M5 4c6 1.5 11 5.5 13 11-2.5-1-5-2.3-7.2-4C13 14 10.5 16 6 16.5c3-1.5 4.5-3.3 5-5C8 10.5 5.5 8 5 4Z"
                />
              }
              @case ('c') {
                <path d="M16 8a6 6 0 1 0 0 8" />
              }
              @case ('python') {
                <path
                  d="M12 3c-3 0-4 1-4 3v2h4M12 3c3 0 4 1 4 3v2h-4M8 8h8v3c0 2-1 3-4 3s-4-1-4-3V8Z"
                />
                <path
                  d="M12 21c3 0 4-1 4-3v-2h-4M12 21c-3 0-4-1-4-3v-2h4M16 16H8v-3c0-2 1-3 4-3s4 1 4 3v3Z"
                />
              }
              @case ('git') {
                <path d="M6 4v16" />
                <path d="M6 8c4 0 4 4 8 4" />
                <circle cx="6" cy="6" r="2" />
                <circle cx="6" cy="18" r="2" />
                <circle cx="16" cy="12" r="2" />
              }
              @case ('database') {
                <path d="M5 6c0-1.5 3-2.5 7-2.5s7 1 7 2.5-3 2.5-7 2.5-7-1-7-2.5Z" />
                <path d="M5 6v12c0 1.5 3 2.5 7 2.5s7-1 7-2.5V6" />
                <path d="M5 12c0 1.5 3 2.5 7 2.5s7-1 7-2.5" />
              }
            }
          </svg>
          <span class="text-sm font-medium text-text">{{ skill.name }}</span>
        </span>
      }
    </div>
  </div>
</section>
