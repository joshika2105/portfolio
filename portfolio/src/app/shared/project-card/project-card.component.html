<article class="surface flex h-full flex-col overflow-hidden transition-transform duration-200 hover:-translate-y-1">
  <div class="project-thumb flex h-56 items-center justify-center border-b border-border">
    <span class="text-6xl font-semibold text-highlight" style="font-family: var(--font-heading);">
      {{ project.name.charAt(0) }}
    </span>
  </div>

  <div class="flex flex-1 flex-col p-6">
    <h3 class="text-lg">{{ project.name }}</h3>
    <p class="mt-2 flex-1 text-sm text-text-secondary">{{ project.description }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
      @for (tech of project.tech; track tech) {
        <span class="tech-tag rounded-md px-2.5 py-1 text-xs font-medium text-highlight">{{ tech }}</span>
      }
    </div>

    <div class="mt-5 flex flex-wrap gap-3">
      <a [href]="project.githubUrl" target="_blank" rel="noopener" class="btn-secondary btn-sm">
        {{ t().githubLabel }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.97.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.39-5.26 5.67.41.36.78 1.07.78 2.16v3.2c0 .3.2.66.79.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"
          />
        </svg>
      </a>
      <a [href]="project.demoUrl" target="_blank" rel="noopener" class="btn-primary btn-sm">
        {{ t().demoLabel }}
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6M15 3h6v6M10 14 21 3" />
        </svg>
      </a>
    </div>
  </div>
</article>
