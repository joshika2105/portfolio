<section id="contact" class="px-6 py-24 sm:px-10 lg:px-16">
  <div class="mx-auto max-w-6xl">
    <div class="grid items-center gap-16 lg:grid-cols-[1.1fr_1fr]">
      <!-- Left: intro + contact methods -->
      <div>
        <p appScrollReveal class="text-xs font-semibold uppercase tracking-[0.15em] text-highlight">
          {{ t().eyebrow }}
        </p>
        <h2 appScrollReveal [revealDelay]="80" class="mt-3">{{ t().title }}</h2>
        <p appScrollReveal [revealDelay]="140" class="mt-4 max-w-md text-text-secondary">
          {{ t().subtitle }}
        </p>

        <div class="mt-10 space-y-5">
          @for (method of methods(); track method.icon; let i = $index) {
            <a
              appScrollReveal
              [revealDelay]="180 + i * 70"
              [href]="method.href"
              [attr.target]="method.icon === 'instagram' ? '_blank' : null"
              [attr.rel]="method.icon === 'instagram' ? 'noopener' : null"
              class="group flex items-center gap-4"
            >
              <span class="contact-icon-tile inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-lg">
                <svg
                  class="h-5 w-5 text-highlight"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  @switch (method.icon) {
                    @case ('email') {
                      <rect x="3" y="5" width="18" height="14" rx="2" />
                      <path d="m3 6 9 7 9-7" />
                    }
                    @case ('phone') {
                      <path
                        d="M6.5 3h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5a2 2 0 0 1 2-2Z"
                      />
                    }
                    @case ('instagram') {
                      <rect x="3" y="3" width="18" height="18" rx="5" />
                      <circle cx="12" cy="12" r="4" />
                      <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none" />
                    }
                  }
                </svg>
              </span>
              <span>
                <span class="block text-xs font-semibold uppercase tracking-wide text-text-secondary">
                  {{ method.label }}
                </span>
                <span class="block text-sm font-medium text-text transition-colors duration-150 group-hover:text-highlight">
                  {{ method.value }}
                </span>
              </span>
            </a>
          }
        </div>
      </div>

      <!-- Right: illustration -->
      <div appScrollReveal [revealDelay]="200" class="mx-auto w-full max-w-xs">
        <svg viewBox="0 0 320 280" class="w-full" role="img" aria-label="Illustration of a laptop with a message bubble">
          <ellipse cx="160" cy="150" rx="140" ry="120" style="fill: var(--bg-secondary)" />

          <circle cx="66" cy="66" r="4" style="fill: var(--accent)" />
          <circle cx="256" cy="94" r="3" style="fill: var(--highlight)" />

          <!-- laptop base -->
          <path d="M90 220 L230 220 L246 206 L74 206 Z" style="fill: var(--card); stroke: var(--border); stroke-width: 2" />

          <!-- laptop screen -->
          <rect x="100" y="90" width="120" height="118" rx="10" style="fill: var(--card); stroke: var(--border); stroke-width: 2" />
          <rect x="110" y="100" width="100" height="86" rx="6" style="fill: var(--primary)" />
          <rect x="120" y="112" width="50" height="6" rx="3" style="fill: var(--secondary)" opacity="0.85" />
          <rect x="120" y="126" width="76" height="6" rx="3" style="fill: var(--accent)" opacity="0.85" />
          <rect x="120" y="140" width="40" height="6" rx="3" style="fill: var(--secondary)" opacity="0.85" />

          <!-- floating message bubble -->
          <path
            d="M198 54h64a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10h-40l-14 14v-14h-10a10 10 0 0 1-10-10V64a10 10 0 0 1 10-10Z"
            style="fill: var(--card); stroke: var(--border); stroke-width: 2"
          />
          <circle cx="216" cy="78" r="3" style="fill: var(--highlight)" />
          <circle cx="230" cy="78" r="3" style="fill: var(--accent)" />
          <circle cx="244" cy="78" r="3" style="fill: var(--highlight)" />
        </svg>
      </div>
    </div>
  </div>
</section>
