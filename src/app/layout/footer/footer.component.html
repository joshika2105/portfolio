<footer class="border-t border-border px-6 py-8 sm:px-10 lg:px-16">
  <div class="mx-auto flex max-w-6xl flex-col items-center gap-4 text-center sm:flex-row sm:justify-between sm:text-left">
    <div>
      <p class="text-sm font-semibold" style="font-family: var(--font-heading);">Sarah Joshika Nelson</p>
      <p class="mt-0.5 text-xs text-text-secondary">© {{ year }} {{ t().rights }}</p>
    </div>

    <div class="flex items-center gap-2">
      @for (link of socialLinks; track link.icon) {
        <a
          [href]="link.href"
          [target]="link.icon === 'email' ? null : '_blank'"
          [rel]="link.icon === 'email' ? null : 'noopener'"
          [attr.aria-label]="link.label"
          class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-text-secondary transition-all duration-150 hover:-translate-y-0.5 hover:text-highlight"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            @switch (link.icon) {
              @case ('github') {
                <path
                  fill="currentColor"
                  d="M12 2.5A9.5 9.5 0 0 0 2.5 12c0 4.2 2.72 7.76 6.5 9.02.47.09.65-.2.65-.46v-1.8c-2.65.58-3.2-1.13-3.2-1.13-.43-1.1-1.06-1.4-1.06-1.4-.87-.6.07-.58.07-.58.96.07 1.47 1 1.47 1 .85 1.46 2.24 1.04 2.78.8.09-.62.33-1.04.6-1.28-2.12-.24-4.34-1.06-4.34-4.7 0-1.04.37-1.9.98-2.56-.1-.24-.43-1.2.1-2.5 0 0 .8-.26 2.6.98a9.1 9.1 0 0 1 4.78 0c1.8-1.24 2.6-.98 2.6-.98.53 1.3.2 2.26.1 2.5.61.66.98 1.52.98 2.56 0 3.65-2.22 4.46-4.34 4.7.34.3.65.87.65 1.76v2.6c0 .26.18.56.66.46A9.5 9.5 0 0 0 21.5 12 9.5 9.5 0 0 0 12 2.5Z"
                ></path>
              }
              @case ('linkedin') {
                <path
                  fill="currentColor"
                  d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5V9h3v10ZM6.5 7.7A1.7 1.7 0 1 1 6.5 4.3a1.7 1.7 0 0 1 0 3.4ZM19 19h-3v-5.1c0-1.2-.4-2-1.5-2-.8 0-1.3.6-1.5 1.1-.1.2-.1.5-.1.8V19h-3s0-9 0-10h3v1.4c.4-.6 1.1-1.5 2.8-1.5 2 0 3.3 1.3 3.3 4.2V19Z"
                ></path>
              }
              @case ('instagram') {
                <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"></circle>
              }
              @case ('email') {
                <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
                <path d="M4 6.5 12 13l8-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              }
            }
          </svg>
        </a>
      }
    </div>
  </div>
</footer>
