<section class="px-6 pb-24 pt-32 sm:px-10 lg:px-16">
  <div class="mx-auto max-w-6xl">
    <a
      routerLink="/"
      class="inline-flex items-center gap-2 text-sm font-medium text-text-secondary transition-colors duration-150 hover:text-highlight"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      {{ t().backHome }}
    </a>

    <p appScrollReveal class="mt-8 text-xs font-semibold uppercase tracking-[0.15em] text-highlight">
      {{ t().eyebrow }}
    </p>
    <h1 appScrollReveal [revealDelay]="80" class="mt-3">{{ t().allTitle }}</h1>
    <p appScrollReveal [revealDelay]="140" class="mt-3 max-w-xl text-text-secondary">
      {{ t().allSubtitle }}
    </p>

    <div class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (project of projects(); track project.name; let i = $index) {
        <div appScrollReveal [revealDelay]="160 + i * 60">
          <app-project-card [project]="project" />
        </div>
      }
    </div>
  </div>
</section>
